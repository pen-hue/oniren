    };
    const result = groups(p.ch).map(g => `<div class='mb-3'><div class='text-red-300 font-bold'>${g.label}</div>` + g.items.map(it => {
      const c = it.c, ls = LV(c.mode).slice(0, Math.min(c.real + 1, 10));

    h += `<div class='card'><h2 class='font-bold text-yellow-400 mb-3'>👥 この回のみんなの予想</h2><div class='flex gap-2 mb-3'><button type='button' class='btn ${pm === 'ch' ? 'bg-red-600' : 'bg-gray-800'}' data-a='pm' data-v='ch'>挑戦者別</button><button type='button' class='btn ${pm === 'pp' ? 'bg-red-600' : 'bg-gray-800'}' data-a='pm' data-v='pp'>予想者別</button></div>`;

    el.innerHTML = h + `</div>`;

  el.innerHTML = totalCard() + `<div class='card'><h2 class='font-bold text-yellow-400 mb-3'>📚 過去の回</h2>` +
    (S.past.length ? S.past.map((p, i) => ({ p, i })).reverse().map(o => `<div class='bg-gray-800 rounded p-3 mb-3 text-sm'><div class='font-bold text-yellow-400 mb-2'>${hdr(o.p)}</div>` +

}

async function savePred(manual) {

  if (takenBy(S.me.name)) { toast('この名前は他の人が使っています。プロフィールで名前を変えてください'); return false; }
  saveState = 'saving'; paintSave();
  try {

  if (f === 'win') d.win = t.value;
  if (f === 'tm') d.tm = t.value;
  if (f === 'ws') { const a = d.ws || []; a[+t.dataset.k] = t.value; for (let j = 0; j < a.length; j++) if (a[j] == null) a[j] = ''; d.ws = a; }
  save(); markDirty();
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.f === 'r') { mine()[+t.dataset.c].r = +t.value; save(); markDirty(); }
  if (t.dataset.f === 'win') { mine()[0].win = t.value; save(); markDirty(); }
  if (t.dataset.f === 'tm') { mine()[+t.dataset.c].tm = t.value; save(); markDirty(); }
});

// ===== Firestore（全員で共有） =====
let okRound = false, okPlayers = false, drawn = false;
function rebuild() {
  S.pred = {}; S.prof = {};
  Object.values(P).sort((a, b) => (a.ts || 0) - (b.ts || 0)).forEach(p => {
    if (p.pred && (p.rid || 0) === S.rid) S.pred[p.name] = p.pred;
    if (p.bio || p.oshi || p.pred) S.prof[p.name] = { bio: p.bio || '', oshi: p.oshi || '' };
  });
}
function refresh(src) {
  if (!(okRound && okPlayers)) return;
  if (!drawn) { drawn = true; R[tabNow](); return; }
  if (tabNow === 'predict') { if (src === 'round') rPredict(); }
  else if (tabNow !== 'admin') {
    const f = document.activeElement;
    if (tabNow === 'profile' && f && f.tagName === 'INPUT' && f.closest('#tab-profile')) return;
    R[tabNow]();
  }
}
const errFn = e => { $('tab-predict').innerHTML = `<p class='text-center text-red-400 py-10'>読み込めませんでした（${esc((e && e.code) || '')}）。Firestoreのルールと設定を確認してください。</p>`; };
let lastKey = null, online = false;
setTimeout(() => { if (!online) { $('sync').textContent = '⚠️ サーバーに接続できていません（Firestoreの作成・ルールを確認）'; $('sync').className = 'text-center text-xs text-red-400 mb-3'; } }, 7000);
onSnapshot(doc(db, 'app', 'round'), { includeMetadataChanges: true }, s => {
  if (!s.metadata.fromCache) { online = true; if (!authErr) { $('sync').textContent = '☁️ 全員と同期中'; $('sync').className = 'text-center text-xs text-green-400 mb-3'; } }
  const d = s.data(), key = JSON.stringify(d || null);
  if (okRound && key === lastKey) return;
  lastKey = key;
  if (d) { S.ch = d.ch; S.decided = !!d.decided; S.rid = d.rid || 0; S.title = d.title || ''; S.airDate = d.airDate || ''; S.win = d.win || ''; S.deadline = d.deadline || ''; S.deadlineMs = d.deadlineMs || 0; S.ok = d.ok || []; }
  okRound = true; rebuild(); refresh('round');
}, errFn);
onSnapshot(collection(db, 'players'), qs => {
  P = {}; qs.forEach(x => { P[x.id] = x.data(); });
  okPlayers = true; rebuild(); refresh('players');
}, errFn);
onSnapshot(collection(db, 'past'), qs => {
  S.past = qs.docs.map(x => ({ id: x.id, ...x.data() })).sort((a, b) => (a.ts || 0) - (b.ts || 0)).map(p => ({
    id: p.id, ts: p.ts || 0, date: p.date, title: p.title || '', win: p.win || '', ok: p.ok || [], ch: p.ch, rank: p.rank || [],
    pred: Object.fromEntries((p.players || []).map(x => [x.n, x.d]))
  }));
  refresh('past');
}, errFn);

onAuthStateChanged(authA, u => {
  const was = admin; admin = !!(u && !u.isAnonymous);
  if (was === admin) return;
  if (tabNow === 'admin') rAdmin(); else if (drawn && tabNow === 'results') rResults();
});
document.addEventListener('visibilitychange', () => { if (document.hidden && saveState === 'dirty') savePred(false); });
let lastLock = null;
setInterval(() => {
  if (!drawn) return;
  const lk = locked();
  if (lastLock !== null && lk !== lastLock && tabNow !== 'admin') R[tabNow]();
  lastLock = lk;
}, 20000);

show('predict');
</script>
</body>
</html>
