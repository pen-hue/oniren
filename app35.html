function statsFor(name) {
  let rounds = 0, pts = 0, ranks = [], ex = 0, near = 0, tot = 0;
  S.past.forEach(p => {
    const rk = withRk((p.rank || []).map(x => ({ ...x }))), me = rk.find(x => x.n === name); if (!me) return;
    rounds++; pts += me.t || 0; ranks.push(me.rk);
    const pr = (p.pred || {})[name] || [];
    (p.ch || []).forEach((c, i) => { const d = pr[i]; if (!d || typeof d.r !== 'number') return; tot++; if (d.r === c.real) ex++; else if (Math.abs(d.r - c.real) === 1) near++; });
  });
  return { rounds, pts, best: ranks.length ? Math.min(...ranks) : 0, avg: ranks.length ? ranks.reduce((s, v) => s + v, 0) / ranks.length : 0, ex, near, tot };
}
const pct = (x, t) => t ? Math.round(x / t * 100) + '%' : '—';
function statsHtml() {
  if (!hasName()) return '';

}
