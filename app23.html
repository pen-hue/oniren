  S.past.forEach(p => withRk(p.rank.map(x => ({ ...x }))).forEach(x => { const o = add(x.n, x); if (x.rk === 1) o.wins++; }));
  if (rankOn()) Object.keys(S.pred).forEach(n => add(n, sc(n)));
  return withRk(Object.values(t).sort((a, b) => b.pt - a.pt), 'pt');
}

async function savePred(manual) {

  pdel: async b => {
    if (!b.dataset.arm) { b.dataset.arm = 1; b.textContent = 'もう一度押すと削除'; return; }
    const i = +b.dataset.i, p = S.past[i]; if (!p) return;
    try { await tmo(deleteDoc(doc(dbA, 'past', p.id))); S.past.splice(i, 1); rAdmin(); toast('削除しました'); } catch (e) { fail(e); }
  },
  dbm: b => { dbm = b.dataset.m; dbq = ''; dbsel = ''; rDb(); },
  dbsel: b => { dbsel = dbsel === b.dataset.n ? '' : b.dataset.n; paintDb(); },
  dbsort: b => { if (dbs === b.dataset.s) dbrev = !dbrev; else { dbs = b.dataset.s; dbrev = false; } rDb(); },
  cdone: async b => { readAdmin(); const c = S.ch[+b.dataset.i]; if (!c) return; c.done = !c.done; if (await pushRound()) { rAdmin(); toast(c.done ? 'この挑戦者を確定しました（ランキングに反映）' : '確定を取り消しました'); } },
  plhide: async b => { readAdmin(); const n = b.dataset.n, h = S.hid || (S.hid = []), j = h.indexOf(n); if (j >= 0) h.splice(j, 1); else h.push(n); if (await pushRound()) { rAdmin(); toast(j >= 0 ? '表示に戻しました' : '非表示にしました（管理人には見えます）'); } },
  qzans: async b => {
    if (!qz || qz.pick) return;
    const o = qz.o, m = myQ(); qz.pick = b.dataset.n;
    if (qz.pick === o.n && hasName() && !qz.prac && !(m.done || []).includes(o.n)) {
      qz.got = true;
      qzSetPend({ name: S.me.name, pt: (m.pt || 0) + 1, done: [...(m.done || []), o.n], ts: Date.now() });
      paintQz(); paintQzRank();
      if (!(await qzFlush())) toast('ポイントを保存できませんでした（' + qzMsg(qzErr) + '）');
    }
    paintQz(); paintQzRank();
  },
  qzhint: () => { if (qz) { qz.hint = true; paintQz(); } },
  qznext: () => { qzNew(); paintQz(); },
  pledit: b => { pledit = b.dataset.id; rAdmin(); },
  plcancel: () => { pledit = ''; rAdmin(); },
  plsave: async b => {
    const id = b.dataset.id, o = P[id]; if (!o) return;
    const n = $('pl-n').value.trim().slice(0, 30);
    if (!n) { toast('名前を入力してください'); return; }
    const data = { name: n, bio: $('pl-b').value.trim().slice(0, 100), oshi: $('pl-o').value.trim().slice(0, 50) };
    try {
      if (pid(n) !== id) {
        if (takenBy(n)) { toast('この名前は既に使われています'); return; }
        const nd = { ...data, ts: o.ts || Date.now() };
        if (o.owner) nd.owner = o.owner;
        if (o.pred) { nd.pred = o.pred; nd.rid = o.rid || 0; }
        await tmo(setDoc(doc(dbA, 'players', pid(n)), nd));
        await tmo(deleteDoc(doc(dbA, 'players', id)));
        delete P[id]; P[pid(n)] = nd;
      } else {
        await tmo(setDoc(doc(dbA, 'players', id), data, { merge: true }));
        Object.assign(P[id], data);
      }
      pledit = ''; rebuild(); rAdmin(); toast('保存しました');
    } catch (e) { fail(e); }
  },
  pldel: async b => {
    if (!b.dataset.arm) { b.dataset.arm = 1; b.textContent = 'もう一度押すと削除'; return; }
    try { await tmo(deleteDoc(doc(dbA, 'players', b.dataset.id))); delete P[b.dataset.id]; rebuild(); rAdmin(); toast('削除しました'); } catch (e) { fail(e); }
  },
  addch: async () => {
    if (S.ch.length >= 10) return toast('挑戦者は最大10人までです');
    readAdmin();
    const cnt = k => S.ch.filter((c, i) => teamOf(c, i) === k).length;
    S.ch.push({ name: '挑戦者' + String.fromCharCode(65 + S.ch.length), mode: 'normal', team: '', real: 0, songs: {} });
    rAdmin(); await pushRound();
  },
  rmch: async () => {
    if (S.ch.length <= 1) return toast('挑戦者は最低1人必要です');
    readAdmin(); S.ch.pop();
    rAdmin(); await pushRound();
  },
  savech: async () => {
    readAdmin();
    if (await pushRound()) { rAdmin(); toast('保存しました'); }
  },
  calc: async () => {
    readAdmin(); S.decided = true;
    if (await pushRound()) { rAdmin(); toast('採点しました！「🏆 ランキング」で確認'); }
  },
  reset: async b => {
    if (!b.dataset.arm) {
      b.dataset.arm = 1;
      b.textContent = S.decided ? 'もう一度押すと過去の回に保存して新しい回を始めます' : 'もう一度押すと全消去します（未採点なので保存されません）';
      return;
    }
    try {
      readAdmin();
      const sv = S.decided;
      if (sv) await tmo(addDoc(collection(dbA, 'past'), {
        date: fmtDate(S.airDate || todayStr()), title: roundTitle(), win: actualWin(), ok: S.ok || [], ts: Date.now(), ch: S.ch,
        players: Object.keys(S.pred).map(n => ({ n, d: S.pred[n] })),
        rank: Object.keys(S.pred).map(n => ({ n, ...sc(n) })).sort((a, b) => b.t - a.t)
      }));
      S.ch.forEach(c => { c.real = 0; c.songs = {}; c.ws = []; c.team = ''; c.done = false; c.dl = ''; });
      S.decided = false; S.rid += 1; S.title = ''; S.airDate = ''; S.win = ''; S.ok = []; S.deadline = ''; S.deadlineMs = 0; S.pub = ''; S.hid = [];
      if (await pushRound()) { rAdmin(); toast((sv ? '過去の回に保存して、新しい回を始めました' : 'リセットしました') + '。締切を設定してください'); }
    } catch (e) { fail(e); }
  },
  vm: b => { vm = b.dataset.v; rResults(); },
  vc: b => { vc = +b.dataset.i; rResults(); },
  vp: b => { vp = b.dataset.n; rResults(); },
  po: b => { po = +b.dataset.i; pp = ''; pc = 0; rPast(); window.scrollTo(0, 0); },
  pback: () => { po = -1; rPast(); },
  pm: b => { pm = b.dataset.v; rPast(); },
  pc: b => { pc = +b.dataset.i; rPast(); },
  pq: b => { pp = b.dataset.n; rPast(); }
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]');
  if (b && A[b.dataset.a]) A[b.dataset.a](b);
});
document.addEventListener('input', e => {
  const t = e.target, f = t.dataset.f; if (!f) return;
  const d = mine()[+t.dataset.c];
  if (f === 's') d.s[t.dataset.l] = t.value;
  if (f === 'c') d.c = t.value;
  if (f === 'win') d.win = t.value;
  if (f === 'tm') d.tm = t.value;
  if (f === 'ws') { const a = d.ws || []; a[+t.dataset.k] = t.value; for (let j = 0; j < a.length; j++) if (a[j] == null) a[j] = ''; d.ws = a; }
  save(); markDirty();
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.f === 'r') { mine()[+t.dataset.c].r = +t.value; save(); markDirty(); }
  if (t.dataset.f === 'win') { mine()[0].win = t.value; save(); markDirty(); }
  if (t.dataset.f === 'tm') { mine()[+t.dataset.c].tm = t.value; save(); markDirty(); }
});

// ===== Firestore（全員で共有） =====
let okRound = false, okPlayers = false, drawn = false;
function rebuild() {
  S.pred = {}; S.prof = {};
  Object.values(P).sort((a, b) => (a.ts || 0) - (b.ts || 0)).forEach(p => {
    if (p.pred && (p.rid || 0) === S.rid) S.pred[p.name] = p.pred;
    if (p.bio || p.oshi || p.pred) S.prof[p.name] = { bio: p.bio || '', oshi: p.oshi || '' };
  });
}
function refresh(src) {
  if (!(okRound && okPlayers)) return;
  if (!drawn) { drawn = true; R[tabNow](); return; }
  if (tabNow === 'predict') { if (src === 'round') rPredict(); }
  else if (tabNow !== 'admin') {
    if (tabNow === 'db' || tabNow === 'quiz') return;
    const f = document.activeElement;
    if (tabNow === 'profile' && f && f.tagName === 'INPUT' && f.closest('#tab-profile')) return;
    R[tabNow]();
  }
}
const errFn = e => { $('tab-predict').innerHTML = `<p class='text-center text-red-400 py-10'>読み込めませんでした（${esc((e && e.code) || '')}）。Firestoreのルールと設定を確認してください。</p>`; };
let lastKey = null, online = false;
setTimeout(() => { if (!online) { $('sync').textContent = '⚠️ サーバーに接続できていません（Firestoreの作成・ルールを確認）'; $('sync').className = 'text-center text-xs text-red-400 mb-3'; } }, 7000);
onSnapshot(doc(db, 'app', 'round'), { includeMetadataChanges: true }, s => {
  if (!s.metadata.fromCache) { online = true; if (!authErr) { $('sync').textContent = '☁️ 全員と同期中'; $('sync').className = 'text-center text-xs text-green-400 mb-3'; } }
  const d = s.data(), key = JSON.stringify(d || null);
  if (okRound && key === lastKey) return;
  lastKey = key;
  if (d) { S.ch = d.ch; S.decided = !!d.decided; S.rid = d.rid || 0; S.title = d.title || ''; S.airDate = d.airDate || ''; S.win = d.win || ''; S.deadline = d.deadline || ''; S.deadlineMs = d.deadlineMs || 0; S.pub = d.pub || ''; S.hid = d.hid || []; S.ok = d.ok || []; }
  okRound = true; rebuild(); refresh('round');
}, errFn);
onSnapshot(collection(db, 'players'), qs => {
  P = {}; qs.forEach(x => { P[x.id] = x.data(); });
  okPlayers = true; rebuild(); refresh('players');
}, errFn);
onSnapshot(collection(db, 'quiz'), qs => { Q = {}; qs.forEach(d => { Q[d.id] = d.data(); }); if (tabNow === 'quiz') { paintQz(); paintQzRank(); } }, () => {});
onSnapshot(collection(db, 'past'), qs => {
  S.past = qs.docs.map(x => ({ id: x.id, ...x.data() })).sort((a, b) => (a.ts || 0) - (b.ts || 0)).map(p => ({
    id: p.id, ts: p.ts || 0, date: p.date, title: p.title || '', win: p.win || '', ok: p.ok || [], ch: p.ch, rank: p.rank || [],
    pred: Object.fromEntries((p.players || []).map(x => [x.n, x.d]))
  }));
  refresh('past');
}, errFn);

onAuthStateChanged(authA, u => {
  const was = admin; admin = !!(u && !u.isAnonymous);
  if (was === admin) return;
  if (tabNow === 'admin') rAdmin(); else if (drawn && tabNow === 'results') rResults();
});
document.addEventListener('visibilitychange', () => { if (document.hidden && saveState === 'dirty') savePred(false); });
let lastLock = null;
setInterval(() => {
  if (!drawn) return;
  const lk = locked();
  if (lastLock !== null && lk !== lastLock && tabNow !== 'admin' && tabNow !== 'quiz' && tabNow !== 'db') R[tabNow]();
  lastLock = lk;
}, 20000);

show('predict');
</script>
</body>
</html>
