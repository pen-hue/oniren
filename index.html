<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鬼レンチャン 予想</title>
<body style="background:#030712;color:#fff;font-family:sans-serif;text-align:center;padding-top:30vh">読み込み中…</body>
<script>
(async () => {
  let n = 4;
  while (true) {
    try {
      const r = await fetch('app' + (n + 1) + '.html', { method: 'HEAD', cache: 'no-store' });
      if (!r.ok) break;
      n++;
    } catch (e) { break; }
  }
  location.replace('app' + n + '.html');
})();
</script>
