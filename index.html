<body>
<p id="msg">読み込み中…</p>
<noscript><p><a href="app32.html">こちらを開いてください</a></p></noscript>
<script>
// 存在する appN.html のうち、いちばん大きい番号へ移動する（上限は app200）
(async () => {
  const TOP = 200, STEP = 20;
  for (let hi = TOP; hi >= 1; hi -= STEP) {
    const ns = []; for (let n = hi; n > Math.max(0, hi - STEP); n--) ns.push(n);
    const res = await Promise.all(ns.map(n => fetch('app' + n + '.html', { method: 'HEAD', cache: 'no-store' }).then(r => r.ok ? n : 0).catch(() => 0)));
    const best = Math.max(0, ...res);
    if (best) { location.replace('app' + best + '.html' + location.search + location.hash); return; }
  }
  document.getElementById('msg').innerHTML = '開けませんでした。<a href="app32.html">こちら</a>を押してください。';
})();
</script>
</body>
